<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Креативы Unity</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1c2430;
      --muted: #667085;
      --line: #e4e7ec;
      --bar: #3b6fd8;
      --head: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .lock-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .lock-card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
    }
    .lock-card h1 { margin: 0 0 18px; font-size: 28px; }
    label { display: block; font-size: 14px; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      background: #1c2430;
      color: #fff;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { min-height: 22px; margin-top: 10px; color: #b42318; font-size: 14px; }
    .hidden { display: none; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
    h1 { margin: 0 0 20px; font-size: 32px; }
    h2 { margin: 28px 0 12px; font-size: 20px; }
    h3 { margin: 22px 0 8px; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .stat-value { font-size: 26px; font-weight: 650; }
    .stat-label { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .bars { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .bar-row { display: grid; grid-template-columns: 150px 1fr 88px; gap: 10px; align-items: center; margin: 8px 0; }
    .bar-name, .bar-value { font-size: 13px; }
    .bar-value { text-align: right; font-variant-numeric: tabular-nums; }
    .bar-track { height: 16px; background: #eef2f6; border-radius: 8px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--bar); border-radius: 8px; }
    .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { background: var(--head); text-align: right; font-weight: 500; position: sticky; top: 0; }
    th.name, td.name { text-align: left; font-weight: 600; }
    td.num { text-align: right; }
    tbody tr:nth-child(even) { background: #fbfcfd; }
    .bench { display: block; font-weight: 650; color: var(--text); }
    .metric { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
    @media (max-width: 800px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .bar-row { grid-template-columns: 120px 1fr 72px; }
    }
  </style>
</head>
<body>
  <main id="lock" class="lock-screen">
    <form class="lock-card" id="form">
      <h1>Креативы Unity</h1>
      <label for="password">Пароль</label>
      <div class="row">
        <input id="password" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
        <button id="submit" type="submit">Открыть</button>
      </div>
      <div id="error" class="error" aria-live="polite"></div>
    </form>
  </main>
  <main id="app" class="hidden">
    <div class="shell" id="content"></div>
  </main>

    function b64ToBytes(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }
    async function decrypt(pass) {
      const encoder = new TextEncoder();
      const saltBytes = b64ToBytes(payload.salt);
      const ivBytes = b64ToBytes(payload.iv);
      const packed = b64ToBytes(payload.data);
      const passKey = await crypto.subtle.importKey("raw", encoder.encode(pass), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: saltBytes, iterations: payload.iterations, hash: "SHA-256" },
        passKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBytes }, key, packed);
      return new TextDecoder().decode(plain);
    }
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("password");
      const button = document.getElementById("submit");
      const error = document.getElementById("error");
      error.textContent = "";
      button.disabled = true;
      button.textContent = "Открываю...";
      try {
        document.getElementById("content").innerHTML = await decrypt(input.value.trim());
        document.getElementById("lock").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        window.scrollTo({ top: 0 });
      } catch (err) {
        error.textContent = "Неверный пароль";
        input.select();
      } finally {
        button.disabled = false;
        button.textContent = "Открыть";
      }
    });
